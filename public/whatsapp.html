<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulateur WhatsApp — Balance Ta Livraison</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0b141a; color:#e9edef; }
    .phone { max-width:420px; margin:20px auto; border:1px solid #222d34; border-radius:16px; overflow:hidden; background:#0b141a; }
    .top { background:#202c33; padding:12px 16px; display:flex; align-items:center; gap:10px; }
    .top .avatar { width:34px; height:34px; border-radius:50%; background:#00a884; display:flex; align-items:center; justify-content:center; }
    .top .name { font-weight:600; } .top .sub { font-size:12px; color:#8696a0; }
    .chat { height:520px; overflow-y:auto; padding:16px; background:#0b141a;
      background-image: linear-gradient(rgba(11,20,26,.95), rgba(11,20,26,.95)); }
    .msg { max-width:80%; padding:8px 12px; border-radius:8px; margin:6px 0; white-space:pre-wrap; font-size:14px; line-height:1.4; }
    .in { background:#202c33; }
    .out { background:#005c4b; margin-left:auto; }
    .bar { display:flex; gap:8px; padding:10px; background:#202c33; }
    .bar input { flex:1; padding:10px 12px; border-radius:20px; border:none; background:#2a3942; color:#e9edef; }
    .bar button { border:none; background:#00a884; color:#04140f; width:42px; border-radius:50%; font-size:18px; cursor:pointer; }
    .who { padding:8px 16px; background:#111b21; font-size:12px; color:#8696a0; display:flex; gap:8px; align-items:center; }
    .who select { background:#2a3942; color:#e9edef; border:none; padding:4px 8px; border-radius:6px; }
    .hint { text-align:center; color:#8696a0; font-size:12px; margin:10px; }
    a { color:#53bdeb; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="avatar">📦</div>
      <div><div class="name">Balance Ta Livraison</div><div class="sub">bot · en ligne</div></div>
    </div>
    <div class="who">
      J'écris depuis :
      <select id="from">
        <option value="+21650000001">Marchand (+216 50 000 001)</option>
        <option value="+21650000002">Transporteur (+216 50 000 002)</option>
        <option value="+21651111111">Numéro inconnu (non inscrit)</option>
      </select>
    </div>
    <div class="chat" id="chat"></div>
    <div class="bar">
      <input id="input" placeholder="Ex : 20111222  ou  AIDE" />
      <button id="send">➤</button>
    </div>
  </div>
  <div class="hint">Essaie : <b>AIDE</b> · <b>20111222</b> · <b>SIGNALER 21000000 no_answer CMD-9</b><br/>
    <a href="/">← Console pro</a></div>

  <script>
    const chat = document.getElementById('chat');
    function bubble(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls; d.textContent = text; chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }
    async function send() {
      const input = document.getElementById('input');
      const text = input.value.trim(); if (!text) return;
      const from = document.getElementById('from').value;
      bubble(text, 'out'); input.value = '';
      try {
        const res = await fetch('/webhook/whatsapp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from, text }),
        });
        const data = await res.json();
        bubble(data.reply || '(pas de réponse)', 'in');
      } catch (e) { bubble('Erreur réseau', 'in'); }
    }
    document.getElementById('send').onclick = send;
    document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    bubble('Envoyez AIDE pour commencer 👋', 'in');
  </script>
</body>
</html>
